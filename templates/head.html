{{ define "head" }}<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A thoughtful home for your Git repositories."><title>{{ if .displayname }}{{ .displayname }} · {{ end }}{{ if .meta.Title }}{{ .meta.Title }}{{ else }}Gitview{{ end }}</title><link rel="icon" href="{{ if .meta.FaviconHref }}{{ .meta.FaviconHref }}{{ else }}/static/favicon.svg{{ end }}"{{ if .meta.FaviconType }} type="{{ .meta.FaviconType }}"{{ end }}><link rel="stylesheet" href="/static/style.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('gitview-theme')||'light'}catch(e){}</script><script src="/static/app.js" defer></script>{{ if and .servername .gomod }}<meta name="go-import" content="{{ .servername }}/{{ .name }} git https://{{ .servername }}/{{ .name }}">{{ end }}</head>{{ end }}
